<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Data Analytics</title>
  <style>
    :root {
      --ink:#0f172a; --muted:#64748b; --line:#cbd5e1; --soft:#f1f5f9;
      --panel:#fff; --blue:#2563eb; --green:#059669; --red:#dc2626;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:#e2e8f0; color:var(--ink); }
    header { display:flex; justify-content:space-between; gap:18px; align-items:center; padding:16px 22px; background:#0f172a; color:#fff; }
    h1 { margin:0; font-size:24px; }
    h2 { margin:0; padding:12px 14px; font-size:15px; border-bottom:1px solid var(--line); }
    p { margin:4px 0 0; color:#cbd5e1; }
    button { border:0; background:var(--blue); color:#fff; padding:9px 12px; border-radius:6px; font-weight:700; cursor:pointer; }
    button.secondary { background:#475569; } button.success { background:var(--green); } button.danger { background:var(--red); }
    input, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:5px; background:#fff; }
    label { font-size:12px; font-weight:800; color:#334155; }
    .hidden { display:none !important; }
    .login-wrap { min-height:calc(100vh - 80px); display:grid; place-items:center; padding:20px; }
    .login-card { width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; box-shadow:0 12px 34px rgba(15,23,42,.12); }
    .login-card h2 { border:0; padding:0; margin-bottom:14px; font-size:22px; }
    .login-card .field { margin-bottom:12px; }
    .hint { margin-top:12px; padding:10px; background:#eff6ff; color:#1e3a8a; border-radius:6px; font-size:13px; line-height:1.45; }
    .toolbar, .filters, .builder, .form-grid { display:grid; gap:10px; padding:12px; background:var(--soft); border-bottom:1px solid var(--line); align-items:end; }
    .filters { grid-template-columns:repeat(8,minmax(115px,1fr)); }
    .builder, .form-grid { grid-template-columns:repeat(5,minmax(140px,1fr)); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; background:#fff; }
    main { padding:14px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    nav button { background:#fff; color:var(--ink); border:1px solid var(--line); }
    nav button.active { background:var(--blue); color:#fff; border-color:var(--blue); }
    .tab { display:none; } .tab.active { display:block; }
    .kpis { display:grid; grid-template-columns:repeat(8,minmax(120px,1fr)); gap:10px; margin-bottom:12px; }
    .kpi, .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; min-width:0; overflow:hidden; }
    .kpi { padding:12px; min-height:76px; } .kpi span { display:block; color:var(--muted); font-size:12px; font-weight:800; }
    .kpi strong { display:block; margin-top:7px; font-size:23px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .chart-scroll { overflow:auto; padding:10px; min-height:360px; max-height:680px; }
    svg { display:block; }
    .table-wrap { overflow:auto; max-height:600px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    table { width:100%; min-width:900px; border-collapse:collapse; font-size:13px; }
    th,td { padding:9px; border-bottom:1px solid #e2e8f0; text-align:left; white-space:nowrap; }
    th { position:sticky; top:0; background:#f8fafc; z-index:1; }
    tr.selected { background:#dbeafe; }
    .status { min-height:22px; margin-bottom:8px; color:var(--muted); }
    .insight-box { white-space:pre-wrap; line-height:1.5; padding:14px; min-height:260px; background:#fff; border:1px solid var(--line); border-radius:8px; }
    .userbar { display:flex; gap:10px; align-items:center; justify-content:flex-end; }
    .userbar strong { color:#fff; }
    @media (max-width:1100px){ .filters,.builder,.form-grid{grid-template-columns:repeat(2,1fr)} .kpis{grid-template-columns:repeat(4,1fr)} .grid{grid-template-columns:1fr} }
    @media (max-width:650px){ header{align-items:flex-start;flex-direction:column}.filters,.builder,.form-grid,.kpis{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Employee Data Analytics</h1>
      <p id="subtitle">Sign in to continue.</p>
    </div>
    <div class="userbar hidden" id="userbar">
      <strong id="userLabel"></strong>
      <button id="sampleBtn" class="success admin-only">Reset Sample Data</button>
      <button id="reportBtn" class="secondary admin-only">HTML Report</button>
      <button id="signOutBtn" class="secondary">Sign Out</button>
    </div>
  </header>

  <section id="loginPanel" class="login-wrap">
    <form id="loginForm" class="login-card">
      <h2>Sign In</h2>
      <div class="field"><label>Username</label><input name="username" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
      <button>Sign In</button>
      <div class="hint">
        Demo admin: <strong>admin</strong> / <strong>admin123</strong><br>
        Demo employee: <strong>EMP001</strong> / <strong>pass123</strong>
      </div>
    </form>
  </section>

  <section id="appShell" class="hidden">
    <section class="filters">
      <div><label>From</label><input id="date_from" type="date"></div>
      <div><label>To</label><input id="date_to" type="date"></div>
      <div class="admin-only"><label>Department</label><select id="department"></select></div>
      <div class="admin-only"><label>Employee</label><select id="employee_id"></select></div>
      <div><label>Task</label><select id="task_type"></select></div>
      <div><label>Project</label><select id="project"></select></div>
      <button id="applyBtn">Apply</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </section>

    <main>
      <nav id="tabs"></nav>
      <div class="status" id="status"></div>

      <section id="dashboard" class="tab">
        <div class="kpis" id="kpis"></div>
        <div class="grid">
          <div class="panel"><h2>Workload Overview</h2><div class="chart-scroll"><svg id="dashboardChartA"></svg></div></div>
          <div class="panel"><h2>Attendance Overview</h2><div class="chart-scroll"><svg id="dashboardChartB"></svg></div></div>
        </div>
      </section>

      <section id="analytics" class="tab">
        <div class="builder">
          <div>
            <label>Graph</label>
            <select id="chart_type">
              <option value="sunburst">Sunburst</option>
              <option value="bar">Bar Chart</option>
              <option value="trend">Trend Line</option>
              <option value="donut">Donut</option>
              <option value="heatmap">Heatmap</option>
              <option value="ideal_actual">Actual vs Ideal</option>
            </select>
          </div>
          <div>
            <label>Metric</label>
            <select id="chart_metric">
              <option value="hours">Hours</option>
              <option value="productivity">Productivity</option>
              <option value="overtime">Overtime</option>
              <option value="logs">Log Count</option>
            </select>
          </div>
          <div>
            <label>Group By</label>
            <select id="chart_group">
              <option value="department">Department</option>
              <option value="employee">Employee</option>
              <option value="task_type">Task</option>
              <option value="project">Project</option>
            </select>
          </div>
          <div>
            <label>Employee</label>
            <select id="chart_employee"></select>
          </div>
          <button id="showChartBtn">Show Analysis</button>
        </div>
        <div class="panel">
          <h2 id="builderTitle">Analysis</h2>
          <div class="chart-scroll"><svg id="builderChart"></svg></div>
        </div>
      </section>

      <section id="employees" class="tab admin-only">
        <form id="employeeForm" class="form-grid">
          <div><label>ID</label><input name="employee_id" required></div>
          <div><label>Name</label><input name="name" required></div>
          <div><label>Department</label><input name="department" required></div>
          <div><label>Role</label><input name="role" required></div>
          <div><label>Location</label><input name="location" required></div>
          <div><label>Manager</label><input name="manager" required></div>
          <div><label>Hire Date</label><input name="hire_date" type="date" required></div>
          <div><label>Status</label><select name="status"><option>Active</option><option>On Leave</option><option>Inactive</option></select></div>
          <button>Save Employee</button>
          <button type="button" id="deleteEmployeeBtn" class="danger">Delete Selected</button>
        </form>
        <div class="table-wrap"><table id="employeesTable"></table></div>
      </section>

      <section id="logs" class="tab">
        <form id="logForm" class="form-grid">
          <div class="admin-only"><label>Employee</label><select name="employee_id"></select></div>
          <div><label>Date</label><input name="log_date" type="date" required></div>
          <div><label>Project</label><input name="project" required></div>
          <div><label>Task</label><input name="task_type" required></div>
          <div><label>Hours Worked</label><input name="hours" type="number" step="0.1" min="0" required></div>
          <div><label>Productivity Score</label><input name="productivity_score" type="number" min="0" max="100" required></div>
          <div><label>Overtime</label><input name="overtime_hours" type="number" step="0.1" min="0"></div>
          <div><label>Notes</label><input name="notes"></div>
          <button>Add Timesheet</button>
          <button type="button" id="deleteLogBtn" class="danger">Delete Selected</button>
        </form>
        <div class="table-wrap"><table id="logsTable"></table></div>
      </section>

      <section id="attendance" class="tab">
        <form id="attendanceForm" class="form-grid">
          <div class="admin-only"><label>Employee</label><select name="employee_id"></select></div>
          <div><label>Date</label><input name="work_date" type="date" required></div>
          <div><label>Status</label><select name="status"><option>Present</option><option>Leave</option><option>Absent</option></select></div>
          <div><label>Sign In</label><input name="check_in" placeholder="09:30"></div>
          <div><label>Sign Out</label><input name="check_out" placeholder="18:00"></div>
          <div><label>Late Minutes</label><input name="late_minutes" type="number" min="0"></div>
          <button>Save Attendance</button>
        </form>
        <div class="table-wrap"><table id="attendanceTable"></table></div>
      </section>

      <section id="insights" class="tab admin-only">
        <div class="grid">
          <div class="insight-box" id="insightText"></div>
          <div class="table-wrap"><table id="performanceTable"></table></div>
        </div>
      </section>
    </main>
  </section>

  <script>
    const palette = ["#2563eb","#059669","#f97316","#7c3aed","#dc2626","#0891b2","#ca8a04","#4f46e5"];
    const state = { user:null, selectedEmployee:null, selectedLog:null, dashboard:null };
    function $(id){ return document.getElementById(id); }
    function today(){ return new Date().toISOString().slice(0,10); }
    function daysAgo(days){ const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); }
    function setStatus(text){ $("status").textContent = text || ""; }
    function isAdmin(){ return state.user && state.user.role === "admin"; }
    function authHeaders(extra={}){ return state.user ? {"X-Auth-User":state.user.username, ...extra} : extra; }
    async function api(path, options={}){
      options.headers = authHeaders(options.headers || {});
      const res = await fetch(path, options);
      const type = res.headers.get("content-type") || "";
      const data = type.includes("application/json") ? await res.json() : await res.text();
      if(!res.ok || data.error) throw new Error(data.error || res.statusText);
      return data;
    }
    function qs(overrides={}){
      const params = new URLSearchParams();
      ["date_from","date_to","task_type","project"].forEach(id => {
        const value = $(id).value;
        if(value && value !== "All") params.set(id, value);
      });
      if(isAdmin()){
        ["department","employee_id"].forEach(id => {
          const value = $(id).value;
          if(value && value !== "All") params.set(id, value);
        });
      }
      Object.entries(overrides).forEach(([key,value]) => {
        if(value && value !== "All") params.set(key,value);
      });
      return params.toString();
    }
    function fillSelect(select, values, useEmployeeId=false){
      select.innerHTML = "";
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = useEmployeeId && value !== "All" ? String(value).split(" - ")[0] : value;
        option.textContent = value;
        select.appendChild(option);
      });
    }
    function selectedEmployeeValue(){ return isAdmin() ? $("chart_employee").value : state.user.employee_id; }
    function formData(form){ return Object.fromEntries(new FormData(form).entries()); }
    function postForm(form, path, after){
      form.addEventListener("submit", async event => {
        event.preventDefault();
        try {
          await api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(formData(form))});
          if(after) await after();
          await refreshAll();
          setStatus("Saved.");
        } catch(err){ setStatus(err.message); }
      });
    }

    function initShell(){
      $("date_from").value = daysAgo(30); $("date_to").value = today();
      $("logForm").elements.log_date.value = today();
      $("logForm").elements.project.value = "Demo";
      $("logForm").elements.task_type.value = "Project Work";
      $("logForm").elements.hours.value = "7.5";
      $("logForm").elements.productivity_score.value = "88";
      $("logForm").elements.overtime_hours.value = "0";
      $("attendanceForm").elements.work_date.value = today();
      $("attendanceForm").elements.status.value = "Present";
      $("attendanceForm").elements.check_in.value = "09:30";
      $("attendanceForm").elements.check_out.value = "18:00";
      $("attendanceForm").elements.late_minutes.value = "0";
      $("employeeForm").elements.hire_date.value = today();
    }
    function applyRoleUi(){
      $("loginPanel").classList.add("hidden");
      $("appShell").classList.remove("hidden");
      $("userbar").classList.remove("hidden");
      $("subtitle").textContent = isAdmin() ? "Admin view: all employees, analytics, reports, and management." : "Employee view: mark attendance and log your own timesheet.";
      $("userLabel").textContent = `${state.user.username} (${state.user.role})`;
      document.querySelectorAll(".admin-only").forEach(el => el.classList.toggle("hidden", !isAdmin()));
      const tabs = isAdmin() ? ["dashboard","analytics","employees","logs","attendance","insights"] : ["logs","attendance"];
      $("tabs").innerHTML = tabs.map((tab,i) => `<button class="${i===0?"active":""}" data-tab="${tab}">${tab === "logs" && !isAdmin() ? "My Timesheets" : title(tab)}</button>`).join("");
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      $(tabs[0]).classList.add("active");
    }
    function title(value){ return value[0].toUpperCase() + value.slice(1); }
    async function signIn(username, password){
      const user = await api("/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username,password})});
      state.user = user;
      localStorage.setItem("employeeAnalyticsUser", user.username);
      initShell();
      applyRoleUi();
      await loadOptions();
      await refreshAll();
    }
    async function restoreSession(){
      const username = localStorage.getItem("employeeAnalyticsUser");
      if(!username) return;
      state.user = {username};
      try {
        state.user = await api("/api/me");
        initShell(); applyRoleUi(); await loadOptions(); await refreshAll();
      } catch(_err){
        localStorage.removeItem("employeeAnalyticsUser");
        state.user = null;
      }
    }
    function signOut(){
      state.user = null;
      localStorage.removeItem("employeeAnalyticsUser");
      $("appShell").classList.add("hidden");
      $("userbar").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
      $("subtitle").textContent = "Sign in to continue.";
    }
    async function loadOptions(){
      const options = await api("/api/options");
      fillSelect($("department"), options.departments);
      fillSelect($("employee_id"), options.employees, true);
      fillSelect($("task_type"), options.task_types);
      fillSelect($("project"), options.projects);
      fillSelect($("chart_employee"), isAdmin() ? options.employees : options.employees.filter(v => v !== "All"), true);
      document.querySelectorAll("select[name=employee_id]").forEach(select => fillSelect(select, options.employees.filter(v => v !== "All"), true));
    }
    async function refreshAll(){
      setStatus("Loading...");
      const query = qs();
      const requests = [api(`/api/logs?${query}`), api(`/api/attendance?${query}`)];
      if(isAdmin()) requests.push(api(`/api/dashboard?${query}`), api(`/api/employees?department=${encodeURIComponent($("department").value || "All")}`), api(`/api/summary?${query}`));
      const results = await Promise.all(requests);
      const logs = results[0], attendance = results[1];
      renderLogs(logs); renderAttendance(attendance);
      if(isAdmin()){
        const dashboard = results[2], employees = results[3], summary = results[4];
        state.dashboard = dashboard;
        renderDashboard(dashboard); renderEmployees(employees); renderInsights(dashboard, summary.summary);
        await renderBuilderChart();
        setStatus(`Loaded ${employees.length} employees, ${logs.length} logs, ${attendance.length} attendance rows.`);
      } else {
        setStatus(`Loaded ${logs.length} timesheet rows and ${attendance.length} attendance rows.`);
      }
    }

    async function renderBuilderChart(){
      const employee = selectedEmployeeValue();
      const query = qs({
        chart_type:$("chart_type").value,
        metric:$("chart_metric").value,
        group_by:$("chart_group").value,
        employee_id:employee
      });
      const payload = await api(`/api/chart?${query}`);
      $("builderTitle").textContent = payload.title;
      drawPayload($("builderChart"), payload);
    }
    function drawPayload(svg, payload){
      if(payload.chart_type === "bar") drawBar(svg, payload.data, payload.title.includes("Productivity") ? "%" : "");
      else if(payload.chart_type === "trend") drawLine(svg, payload.data, payload.title.includes("Productivity") ? "%" : "");
      else if(payload.chart_type === "donut") drawDonut(svg, payload.data);
      else if(payload.chart_type === "heatmap") drawHeatmap(svg, payload.data);
      else if(payload.chart_type === "ideal_actual") drawIdealActual(svg, payload.data);
      else if(payload.chart_type === "sunburst") drawSunburst(svg, payload.data);
    }
    function renderDashboard(data){
      const s = data.summary;
      const items = [["Employees",s.total_employees],["Hours",s.total_hours],["Productivity",s.avg_productivity+"%"],["Attendance",s.attendance_rate+"%"],["Overtime",s.overtime_hours],["Absences",s.absence_count],["Late Min",s.late_minutes],["Logs",s.work_logs]];
      $("kpis").innerHTML = items.map(i => `<div class="kpi"><span>${i[0]}</span><strong>${i[1]}</strong></div>`).join("");
      drawBar($("dashboardChartA"), data.hours_by_department);
      drawDonut($("dashboardChartB"), data.attendance_breakdown);
    }
    function renderEmployees(rows){
      renderTable($("employeesTable"), [
        ["employee_id","ID"],["name","Name"],["department","Department"],["role","Role"],["location","Location"],["manager","Manager"],["hire_date","Hire Date"],["status","Status"]
      ], rows, row => {
        state.selectedEmployee = row.employee_id;
        Object.keys(row).forEach(key => $("employeeForm").elements[key] && ($("employeeForm").elements[key].value = row[key]));
      });
    }
    function renderLogs(rows){
      renderTable($("logsTable"), [
        ["log_id","ID"],["log_date","Date"],["employee_id","Emp ID"],["name","Name"],["project","Project"],["task_type","Task"],["hours","Hours"],["productivity_score","Score"],["overtime_hours","OT"],["notes","Notes"]
      ], rows, row => state.selectedLog = row.log_id);
    }
    function renderAttendance(rows){
      renderTable($("attendanceTable"), [
        ["attendance_id","ID"],["work_date","Date"],["employee_id","Emp ID"],["name","Name"],["status","Status"],["check_in","Sign In"],["check_out","Sign Out"],["late_minutes","Late"]
      ], rows);
    }
    function renderInsights(dashboard, summary){
      $("insightText").textContent = summary + "\n\nTop performers:\n" + dashboard.employee_performance.slice(0,5).map(row => `${row.name}: ${row.avg_productivity}% productivity, ${row.total_hours} hours`).join("\n");
      renderTable($("performanceTable"), [
        ["employee_id","ID"],["name","Name"],["department","Department"],["role","Role"],["log_count","Logs"],["total_hours","Hours"],["avg_productivity","Avg Score"],["avg_daily_hours","Daily Hrs"],["overtime_hours","Overtime"]
      ], dashboard.employee_performance);
    }
    function renderTable(table, columns, rows, onSelect){
      table.innerHTML = `<thead><tr>${columns.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody></tbody>`;
      const body = table.querySelector("tbody");
      rows.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = columns.map(c => `<td>${row[c[0]] == null ? "" : row[c[0]]}</td>`).join("");
        tr.onclick = () => {
          body.querySelectorAll("tr").forEach(item => item.classList.remove("selected"));
          tr.classList.add("selected"); if(onSelect) onSelect(row);
        };
        body.appendChild(tr);
      });
    }

    function drawBar(svg, data, suffix=""){
      const width=Math.max(svg.parentElement.clientWidth-24, 110 + data.length*96), height=330, left=56, top=28, bottom=58, right=20;
      prep(svg,width,height); if(!data.length) return empty(svg,width,height);
      const max=Math.max(...data.map(d=>d[1]),1), chartH=height-top-bottom, gap=14, barW=Math.max(32,(width-left-right-gap*(data.length-1))/data.length);
      axis(svg,left,top,width-right,top+chartH);
      data.forEach((d,i)=>{ const x=left+i*(barW+gap), h=d[1]/max*chartH; rect(svg,x,top+chartH-h,barW,h,palette[i%palette.length]); txt(svg,x+barW/2,top+chartH-h-7,`${Number(d[1]).toFixed(d[1]%1?1:0)}${suffix}`,"middle",11); txt(svg,x+barW/2,top+chartH+22,short(d[0],14),"middle",11,"#334155"); });
    }
    function drawLine(svg,data,suffix=""){
      const width=Math.max(svg.parentElement.clientWidth-24,760), height=330, left=56, top=34, bottom=48, right=30; prep(svg,width,height); if(!data.length) return empty(svg,width,height);
      const values=data.map(d=>d[1]), min=Math.min(...values), max=Math.max(...values), span=Math.max(max-min,1), chartW=width-left-right, chartH=height-top-bottom;
      axis(svg,left,top,width-right,top+chartH);
      const points=data.map((d,i)=>[left+(i/Math.max(data.length-1,1))*chartW, top+chartH-((d[1]-min)/span)*chartH]);
      path(svg,"M"+points.map(p=>p.join(",")).join(" L"),"none","#2563eb",3); points.forEach(p=>circle(svg,p[0],p[1],3.5,"#2563eb"));
      txt(svg,left,top+chartH+24,data[0][0],"start",11,"#334155"); txt(svg,width-right,top+chartH+24,data[data.length-1][0],"end",11,"#334155"); txt(svg,width-right,top+12,`Latest ${Number(values[values.length-1]).toFixed(1)}${suffix}`,"end",12);
    }
    function drawDonut(svg,data){
      const width=Math.max(svg.parentElement.clientWidth-24,460), height=330; prep(svg,width,height); if(!data.length) return empty(svg,width,height);
      const total=data.reduce((s,d)=>s+d[1],0)||1, cx=150, cy=165, r=104, inner=56; let start=-90;
      data.forEach((d,i)=>{ const angle=d[1]/total*360; path(svg,donutArc(cx,cy,r,inner,start,start+angle),palette[i%palette.length],"white",1); start+=angle; rect(svg,300,104+i*28,12,12,palette[i%palette.length]); txt(svg,322,115+i*28,`${d[0]} ${(d[1]/total*100).toFixed(1)}%`,"start",12,"#334155"); });
      txt(svg,cx,cy-3,total,"middle",21,"#0f172a","700"); txt(svg,cx,cy+21,"records","middle",12,"#64748b");
    }
    function drawHeatmap(svg,data){
      const rows=[...new Set(data.map(d=>d[0]))].sort(), cols=[...new Set(data.map(d=>d[1]))].sort(), map=new Map(data.map(d=>[`${d[0]}|${d[1]}`,d[2]]));
      const cellW=112, cellH=38, left=124, top=48, width=Math.max(svg.parentElement.clientWidth-24,left+cols.length*cellW+24), height=Math.max(360,top+rows.length*cellH+44); prep(svg,width,height); if(!data.length) return empty(svg,width,height);
      const max=Math.max(...data.map(d=>d[2]),1); cols.forEach((c,i)=>txt(svg,left+i*cellW+cellW/2,26,short(c,13),"middle",11,"#334155"));
      rows.forEach((r,ri)=>{ txt(svg,left-10,top+ri*cellH+23,r,"end",11,"#334155"); cols.forEach((c,ci)=>{ const v=map.get(`${r}|${c}`)||0, alpha=Math.max(.12,v/max); rect(svg,left+ci*cellW,top+ri*cellH,cellW-4,cellH-4,`rgba(37,99,235,${alpha})`); if(v) txt(svg,left+ci*cellW+cellW/2,top+ri*cellH+22,Number(v).toFixed(0),"middle",11); }); });
    }
    function drawIdealActual(svg,rows){ drawBar(svg, rows.flatMap(row => [[row[0]+" actual",row[1]],[row[0]+" ideal",row[2]]])); }
    function drawSunburst(svg,root){
      const width=Math.max(svg.parentElement.clientWidth-24,760), height=640; prep(svg,width,height); const cx=width/2, cy=height/2, radius=Math.min(width,height)/2-28; compute(root); if(!root.value) return empty(svg,width,height);
      const nodes=[]; partition(root,-90,270,0,nodes); const maxDepth=Math.max(...nodes.map(n=>n.depth),1);
      nodes.filter(n=>n.depth>0).forEach((n,i)=>{ const inner=radius*(n.depth-1)/maxDepth, outer=radius*n.depth/maxDepth; path(svg,donutArc(cx,cy,outer,inner,n.start,n.end),n.color||palette[i%palette.length],"white",1); });
      nodes.filter(n=>n.depth>0 && (n.end-n.start)>11).forEach(n=>{ const a=(n.start+n.end)/2*Math.PI/180, r=radius*(n.depth-.5)/maxDepth; txt(svg,cx+Math.cos(a)*r,cy+Math.sin(a)*r,short(n.name,13),"middle",10); });
      txt(svg,cx,cy-4,Number(root.value).toFixed(0),"middle",24,"#0f172a","700"); txt(svg,cx,cy+22,"hours","middle",12,"#64748b");
    }
    function compute(node){ node.value=node.value || (node.children||[]).reduce((s,c)=>s+compute(c),0); return node.value; }
    function partition(node,start,end,depth,nodes,color){ const inherited=node.color||color; nodes.push({...node,start,end,depth,color:inherited}); if(!node.children || !node.children.length) return; let cursor=start; node.children.forEach((child,i)=>{ const angle=(end-start)*child.value/node.value; partition(child,cursor,cursor+angle,depth+1,nodes,child.color||inherited||palette[i%palette.length]); cursor+=angle; }); }
    function donutArc(cx,cy,r,inner,start,end){ const p1=polar(cx,cy,r,end), p2=polar(cx,cy,r,start), p3=polar(cx,cy,inner,start), p4=polar(cx,cy,inner,end), large=end-start>180?1:0; return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 0 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${inner} ${inner} 0 ${large} 1 ${p4.x} ${p4.y} Z`; }
    function polar(cx,cy,r,angle){ const a=angle*Math.PI/180; return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}; }
    function prep(svg,w,h){ svg.setAttribute("viewBox",`0 0 ${w} ${h}`); svg.setAttribute("width",w); svg.setAttribute("height",h); svg.innerHTML=""; }
    function axis(svg,x1,y1,x2,y2){ line(svg,x1,y1,x1,y2,"#94a3b8"); line(svg,x1,y2,x2,y2,"#94a3b8"); }
    function empty(svg,w,h){ txt(svg,w/2,h/2,"No data for this filter","middle",13,"#64748b"); }
    function short(v,l){ v=String(v); return v.length>l ? v.slice(0,l-1)+"..." : v; }
    function el(svg,name,attrs){ const node=document.createElementNS("http://www.w3.org/2000/svg",name); Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v)); svg.appendChild(node); return node; }
    function rect(svg,x,y,width,height,fill){ return el(svg,"rect",{x,y,width,height,fill,rx:3}); }
    function line(svg,x1,y1,x2,y2,stroke){ return el(svg,"line",{x1,y1,x2,y2,stroke}); }
    function circle(svg,cx,cy,r,fill){ return el(svg,"circle",{cx,cy,r,fill}); }
    function path(svg,d,fill="none",stroke="none",width=1){ return el(svg,"path",{d,fill,stroke,"stroke-width":width}); }
    function txt(svg,x,y,value,anchor,size,fill="#0f172a",weight="400"){ const node=el(svg,"text",{x,y,"text-anchor":anchor,"font-size":size,fill,"font-weight":weight,"font-family":"Segoe UI, Arial"}); node.textContent=value; return node; }

    function bindEvents(){
      $("loginForm").onsubmit = async e => { e.preventDefault(); const data=formData(e.currentTarget); try{ await signIn(data.username, data.password); }catch(err){ alert(err.message); } };
      $("signOutBtn").onclick = signOut;
      $("applyBtn").onclick = refreshAll;
      $("clearBtn").onclick = async () => { ["date_from","date_to"].forEach(id=>$(id).value=""); ["department","employee_id","task_type","project"].forEach(id=>$(id) && ($(id).value="All")); await refreshAll(); };
      $("sampleBtn").onclick = async () => { if(confirm("Replace all local data with sample data?")){ await api("/api/reset-sample",{method:"POST"}); await loadOptions(); await refreshAll(); } };
      $("reportBtn").onclick = () => window.open(`/api/report?${qs()}`,"_blank");
      $("showChartBtn").onclick = renderBuilderChart;
      $("tabs").onclick = e => { const btn=e.target.closest("button"); if(!btn) return; document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active")); document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); btn.classList.add("active"); $(btn.dataset.tab).classList.add("active"); if(btn.dataset.tab==="analytics") renderBuilderChart(); };
      postForm($("employeeForm"), "/api/employees", loadOptions);
      postForm($("logForm"), "/api/logs");
      postForm($("attendanceForm"), "/api/attendance");
      $("deleteLogBtn").onclick = async () => { if(!state.selectedLog) return setStatus("Select a timesheet row first."); if(confirm(`Delete log ${state.selectedLog}?`)){ await api(`/api/logs/${state.selectedLog}`,{method:"DELETE"}); state.selectedLog=null; await refreshAll(); } };
      $("deleteEmployeeBtn").onclick = async () => { if(!state.selectedEmployee) return setStatus("Select an employee first."); if(confirm(`Delete employee ${state.selectedEmployee}?`)){ await api(`/api/employees/${state.selectedEmployee}`,{method:"DELETE"}); state.selectedEmployee=null; await loadOptions(); await refreshAll(); } };
    }
    bindEvents();
    restoreSession();
  </script>
